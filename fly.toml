# fly.toml app configuration file generated for churnveda-s on 2026-11-20T06:36:24Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'churnveda-s'
primary_region = 'ams'

[build]

[env]
  PORT = '3000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

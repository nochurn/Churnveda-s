# Netlify Configuration for Churnveda
# Production deployment configuration for frontend SPA on Netlify

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false"

# Optimized caching for immutable hashed assets generated by Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for customer data protection
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ==============================================================================
# BACKEND API PROXY (Optional for external backend hosting)
# ==============================================================================
# If your backend Express server is deployed on Railway, Render, Fly.io, or Cloud Run,
# uncomment and update the rule below with your live backend domain.
# Netlify will transparently proxy all API requests, maintaining cookies and SSL:
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.up.railway.app/api/:splat"
#   status = 200
#   force = true
# ==============================================================================

# Single Page Application (SPA) redirect rule
# Ensures client-side routing works for all URLs without 404 errors
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
